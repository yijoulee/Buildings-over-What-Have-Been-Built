                <figure class="figure" style="--image-ratio: {{ratio}}">
                  <div class="image-frame">
                    <img src="{{src}}" srcset="{{srcset}}" sizes="{{sizes}}" width="{{width}}" height="{{height}}" alt="{{caption}}" loading="{{loading}}" decoding="async">
                  </div>
                  <figcaption class="figure__caption">
                    <span class="figure-label">{{label}}</span>
                    <span class="caption-box">{{caption}}</span>
                  </figcaption>
                </figure>
