# ── FUNCTION ──────────────────────────────────────────
# One shared list for original_function and new_function.
# Categories enable the transition analysis: Industry → Culture, etc.

function:
  Transport:         [Train Station, Cruise Terminal]
  Industry & Energy: [Power Station, Gasometer, Fuel Depot, Warehouse, Factory]
  Religious:         [Church, Temple]
  Defensive:         [Defensive Wall, Castle, Arsenal]
  Cultural & Civic:  [Museum, Theatre, Congress Hall, Archaeological Site, Education Facility,
                      Library, Courthouse, Government Building, Prison, Concert Hall]
  Residential:       [House, Collective Housing, Hostel]
  Commercial:        [Office Building, Retail, Book Store, Marketplace]
  Others:            [Mixed Use]

# ── FORM ──────────────────────────────────────────────
form_geometry:     [Rectangular, Circular, Triangular, Curved, Irregular, Polygonal, Collided]
form_organisation: [Linear, Radial, Clustered, Grid, Centralized, Singular]

# ── STRATEGY ──────────────────────────────────────────
strategy: [Function Follows Form, Disconnect, Horizontal Proliferation,
           Infill, Overlap, Explode and Reorganise]

# ── OPERATION ─────────────────────────────────────────
operation: [Additive, Subtractive]
